<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success Investments Poster Generator</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#d9f0ff,#0b4ea2);
    color:white;
}
.container{
    max-width:900px;
    margin:40px auto;
    text-align:center;
}
h1{
    color:gold;
    font-size:42px;
}
h2{
    font-size:26px;
}
.button{
    display:inline-block;
    padding:15px 30px;
    background:gold;
    color:#003366;
    text-decoration:none;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    margin-top:30px;
}
.card{
    background:white;
    color:#003366;
    padding:30px;
    border-radius:15px;
    margin-top:30px;
}
</style>

</head>

<body>

<div class="container">

<h1>SUCCESS INVESTMENTS</h1>

<h2>Insurance Poster Generator</h2>

<div class="card">

<p>Create professional SBI Life posters within seconds.</p>

<p>✔️ Smart Swadhan Neo</p>
<p>✔️ Mutual Funds</p>
<p>✔️ Retirement Plans</p>
<p>✔️ Child Education Plans</p>
<p>✔️ Health Insurance</p>

<form id="posterForm">

<input type="text" placeholder="Customer Name" required><br><br>

<input type="number" placeholder="Age" required><br><br>

<select required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select><br><br>

<input type="text" placeholder="Plan Name"><br><br>

<input type="number" placeholder="Premium Paying Term"><br><br>

<input type="number" placeholder="Policy Term"><br><br>

<input type="text" placeholder="Annual Premium"><br><br>

<input type="text" placeholder="Life Cover (Sum Assured)"><br><br>

<input type="text" placeholder="Maturity Benefit"><br><br>

<input type="text" placeholder="Customer Mobile"><br><br>

<button class="button" type="submit">Generate Poster</button>

</form>

</div>

</div>

</body>
</html>
